<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#38216b"><meta name="description" content="Rekap Bulanan GPS FM dengan tampilan publik dan unduhan Excel.">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./gps-fm-icon-192x192.png">
<title>Rekap Bulanan GPS FM</title>
<style>
:root{--p:#38216b;--p2:#56389a;--gold:#e7bd62;--ink:#28243b;--muted:#77748b;--line:#e9e5f1;--bg:#f6f4fa;--green:#16834a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(120deg,#2b1857,#56389a);color:white;padding:30px 20px 72px}.hero-inner{max-width:1200px;margin:auto;display:flex;align-items:center;gap:16px}
.brand{width:64px;height:64px;flex:0 0 64px;border-radius:17px;background:#ffffff20;border:1px solid #ffffff35;display:grid;place-items:center;overflow:hidden}.brand img{display:block;width:100%;height:100%;object-fit:contain;border-radius:15px}
h1{font-size:clamp(25px,4vw,35px);margin:0 0 7px;letter-spacing:-.6px}.subtitle{margin:0;color:#e5ddf5;font-size:14px}
main{max-width:1200px;margin:-46px auto 36px;padding:0 16px}.panel{background:white;border:1px solid #eeeaf5;border-radius:20px;box-shadow:0 14px 40px #2c1a4b12;overflow:hidden}
.toolbar{padding:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.search{position:relative;flex:1;min-width:210px}
input,select{width:100%;padding:12px 14px;border:1px solid #ddd8e9;border-radius:11px;font:inherit;outline:none;background:#fff;color:var(--ink)}input:focus{border-color:#8c75c5;box-shadow:0 0 0 3px #8c75c522}
button{border:0;border-radius:11px;padding:12px 16px;font:600 13px system-ui;cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait}.secondary{background:#f0ebf8;color:var(--p)}.primary{background:var(--green);color:#fff}
.meta{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:130px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}.value{font-size:18px;font-weight:800;margin-top:5px}
.sheet-details{margin:16px 20px 0;padding:15px 18px;display:flex;gap:14px;flex-wrap:wrap;background:#faf8ff;border:1px solid var(--line);border-radius:12px}.sheet-details>div{flex:1;min-width:180px;display:flex;flex-direction:column;gap:5px}.sheet-details span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.sheet-details strong{font-size:16px;color:var(--p);overflow-wrap:anywhere}.status{margin:15px 20px 0;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.5;background:#f4f1fb;color:#5d4b87}.status.error{background:#fff1f0;color:#b42318}.status.success{background:#eaf7ef;color:#166534}
.table-wrap{overflow:auto;margin:16px 20px 20px;border:1px solid var(--line);border-radius:12px;max-height:66vh}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}thead th{position:sticky;top:0;background:#eee8f8;color:var(--p);font-weight:800;text-align:left;white-space:nowrap;z-index:1}th,td{padding:13px 14px;border-bottom:1px solid #efedf4;border-right:1px solid #f1eff6;max-width:420px}th:last-child,td:last-child{border-right:0}tbody tr:nth-child(even){background:#fbfaff}tbody tr:hover{background:#f2edfb}td{white-space:pre-wrap;overflow-wrap:anywhere}.empty{text-align:center;padding:35px;color:var(--muted)}footer{text-align:center;color:#8a8599;font-size:11px;padding:0 20px 20px}
@media(max-width:620px){.hero{padding:24px 16px 66px}.brand{width:48px;height:48px}.toolbar{padding:14px}.search{min-width:100%}.toolbar button{flex:1}.meta{padding:13px 14px 0}.stat{flex:1;min-width:calc(50% - 6px)}.table-wrap{margin:14px 12px;max-height:65vh}th,td{padding:11px 12px;max-width:260px}.status{margin:13px 14px 0}.sheet-details{margin:13px 14px 0;padding:13px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="brand"><img src="./gps-fm-icon-192x192.png" alt="Logo GPS FM"></div><div><h1>Rekap Bulanan GPS FM</h1><p class="subtitle">Ringkasan data bulanan · Tampilan publik</p></div></div></header>
<main><section class="panel" aria-label="Data Rekap Bulanan">
<div class="toolbar"><label class="search"><input id="search" type="search" placeholder="Cari di semua kolom…" aria-label="Cari data"></label><button id="refresh" class="secondary">↻ Muat ulang</button><button id="download" class="primary" disabled>⇩ Unduh Excel (.xlsx)</button></div>
<div class="meta"><div class="stat"><div class="label">Total baris data</div><div id="rows" class="value">—</div></div><div class="stat"><div class="label">Jumlah kolom</div><div id="cols" class="value">—</div></div><div class="stat"><div class="label">Terakhir dimuat</div><div id="updated" class="value" style="font-size:13px">—</div></div></div>
<div class="sheet-details"><div><span>Nama Kegiatan</span><select id="activity" aria-label="Pilih Nama Kegiatan" disabled><option>Memuat daftar kegiatan…</option></select></div><div><span>Bulan dan Tahun</span><select id="month" aria-label="Pilih Bulan dan Tahun" disabled><option>Memuat daftar bulan…</option></select></div></div><div id="status" class="status" role="status" aria-live="polite">Menghubungkan ke spreadsheet…</div><div class="table-wrap"><table id="table"><thead></thead><tbody><tr><td class="empty">Memuat data…</td></tr></tbody></table></div>
<footer>Sumber data: Google Spreadsheet · <strong>Rekap Bulanan GPS FM</strong></footer></section></main>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
const ID="1Z4d9NiKfyV4UV0U9uZdlZNIZcMxXmNvzK5zbgnPFBSw",GID="1547468434";
const DATA_URL=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&sheet=Data%20Rekapan&range=A:D`;
const cellURL=cell=>`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&gid=${GID}&range=${cell}`;
const $=id=>document.getElementById(id);let headers=[],data=[],sourceRows=[],teacherOrder=[],monthLabel="",selectedMonthKey="";
function status(msg,type=""){$("status").textContent=msg;$("status").className="status"+(type?" "+type:"")}
function csvParse(s){let out=[],r=[],c="",q=false;for(let i=0;i<s.length;i++){let x=s[i];if(q){if(x==='"'&&s[i+1]==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===","){r.push(c);c=""}else if(x==="\n"){r.push(c.replace(/\r$/,""));out.push(r);r=[];c=""}else c+=x}if(c.length||r.length){r.push(c.replace(/\r$/,""));out.push(r)}while(out.length&&out[out.length-1].every(v=>!String(v).trim()))out.pop();return out}
async function readCell(cell){const r=await fetch(cellURL(cell),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const p=csvParse(await r.text());return p?.[0]?.[0]??""}
async function readRange(range){const r=await fetch(cellURL(range),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);return csvParse(await r.text()).map(row=>String(row[0]??"").trim())}
function norm(s){return String(s??"").trim().toLocaleLowerCase("id").normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
const monthNames=["januari","februari","maret","april","mei","juni","juli","agustus","september","oktober","november","desember"];
function parseDate(v){const s=String(v??"").trim();if(!s)return null;let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let a=+m[1],b=+m[2],y=+m[3];if(y<100)y+=2000;let day,mon;if(a>12){day=a;mon=b}else if(b>12){mon=a;day=b}else{day=a;mon=b}const d=new Date(y,mon-1,day);return Number.isNaN(d.getTime())?null:d}const d=new Date(s);return Number.isNaN(d.getTime())?null:d}
function monthParts(s){const n=norm(s);let mi=monthNames.findIndex(m=>n.includes(m));let y=(String(s).match(/\b(20\d{2})\b/)||[])[1];return {month:mi,year:y?+y:null}}
function rowMonth(v){const d=parseDate(v);if(d)return {month:d.getMonth(),year:d.getFullYear()};const n=norm(v);const mi=monthNames.findIndex(m=>n.includes(m));const y=(String(v).match(/\b(20\d{2})\b/)||[])[1];return {month:mi,year:y?+y:null}}
async function load(){ $("refresh").disabled=true;$("download").disabled=true;$("activity").disabled=true;status("Mengambil data dari sheet Data Rekapan…");try{const [month,names]=await Promise.all([readCell("D6"),readRange("C9:C100")]);monthLabel=month||"";teacherOrder=[...new Set(names.filter(Boolean))];if(!teacherOrder.length)throw Error("Daftar Nama Ustadz tidak ditemukan pada sheet Rekap Bulanan (C9:C100).");const res=await fetch(DATA_URL,{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);const txt=await res.text();if(/^\s*<(!doctype|html)/i.test(txt))throw Error("Google mengirim halaman HTML, bukan CSV. Pastikan sheet Data Rekapan dapat diakses publik.");const parsed=csvParse(txt);if(parsed.length<2)throw Error("Data Rekapan kosong atau header tidak ditemukan.");const h=parsed[0].map(v=>norm(v));const idx={activity:h.findIndex(v=>v==="nama kegiatan"||v==="kegiatan"),teacher:h.findIndex(v=>v==="nama guru"||v==="guru"),date:h.findIndex(v=>v==="tanggal"),status:h.findIndex(v=>v==="status")};if(Object.values(idx).some(v=>v<0))throw Error("Header Data Rekapan harus memuat: Nama Kegiatan, Nama Guru, Tanggal, Status.");sourceRows=parsed.slice(1).filter(r=>r.some(v=>String(v??"").trim())).map(r=>({activity:String(r[idx.activity]??"").trim(),teacher:String(r[idx.teacher]??"").trim(),date:String(r[idx.date]??"").trim(),status:String(r[idx.status]??"").trim()}));const activities=[...new Set(sourceRows.map(r=>r.activity).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"id"));const select=$("activity");select.replaceChildren();if(!activities.length)throw Error("Tidak ada Nama Kegiatan pada Data Rekapan.");activities.forEach((name,i)=>{const op=document.createElement("option");op.value=name;op.textContent=name;select.append(op)});select.disabled=false;select.onchange=renderSummary;const months=new Map();sourceRows.forEach(r=>{const d=parseDate(r.date);if(d){const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");if(!months.has(key))months.set(key,{key,year:d.getFullYear(),month:d.getMonth()})}});const monthSelect=$("month");monthSelect.replaceChildren();const monthOptions=[...months.values()].sort((a,b)=>b.key.localeCompare(a.key));if(!monthOptions.length)throw Error("Tidak ada tanggal valid pada kolom Tanggal di Data Rekapan.");monthOptions.forEach(m=>{const op=document.createElement("option");op.value=m.key;op.textContent=monthNames[m.month].replace(/^./,x=>x.toLocaleUpperCase("id"))+" "+m.year;monthSelect.append(op)});const preferred=monthParts(monthLabel);const matching=monthOptions.find(m=>(preferred.month<0||m.month===preferred.month)&&(!preferred.year||m.year===preferred.year));selectedMonthKey=(matching||monthOptions[0]).key;monthSelect.value=selectedMonthKey;monthSelect.disabled=false;monthSelect.onchange=()=>{selectedMonthKey=monthSelect.value;renderSummary()};renderSummary();$("updated").textContent=new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});$("download").disabled=false;status("Data kegiatan berhasil dimuat dari Data Rekapan.","success")}catch(e){headers=[];data=[];render();$("rows").textContent="—";$("cols").textContent="—";$("updated").textContent="—";status("Data belum dapat dimuat. Periksa izin akses spreadsheet dan nama sheet Data Rekapan. Detail: "+e.message,"error")}finally{$("refresh").disabled=false}}
function renderSummary(){const chosen=$("activity").value,monthKey=$("month").value;selectedMonthKey=monthKey;const filtered=sourceRows.filter(r=>{if(r.activity!==chosen)return false;const d=parseDate(r.date);if(!d)return false;const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");return key===monthKey});const teachers=teacherOrder;headers=["Nama Ustadz","Hadir","Sakit","Tugas","Izin Pribadi","Alfa"];const keys=["hadir","sakit","tugas","izin pribadi","alfa"];data=teachers.map(teacher=>{const counts=keys.map(k=>filtered.filter(r=>norm(r.teacher)===norm(teacher)&&norm(r.status)===k).length);return [teacher,...counts]});render();$("rows").textContent=data.length.toLocaleString("id-ID");$("cols").textContent=headers.length.toLocaleString("id-ID");if(!data.length)status("Tidak ada data untuk kegiatan dan bulan yang dipilih.","");else status("Rekap dihitung berdasarkan Nama Guru, Nama Kegiatan, bulan pada Tanggal, dan Status.","success")}
function render(){const term=$("search").value.trim().toLocaleLowerCase("id"),filtered=data.filter(r=>!term||r.some(v=>String(v).toLocaleLowerCase("id").includes(term))),th=$("table").querySelector("thead"),tb=$("table").querySelector("tbody");th.replaceChildren();tb.replaceChildren();if(!headers.length){const tr=document.createElement("tr"),td=document.createElement("td");td.className="empty";td.textContent="Belum ada data untuk ditampilkan.";tr.append(td);tb.append(tr);return}const hr=document.createElement("tr");headers.forEach(h=>{const x=document.createElement("th");x.textContent=h;hr.append(x)});th.append(hr);if(!filtered.length){const tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=headers.length;td.className="empty";td.textContent=term?"Tidak ada data yang cocok.":"Tidak ada rekap untuk pilihan ini.";tr.append(td);tb.append(tr)}else{const frag=document.createDocumentFragment();filtered.forEach(r=>{const tr=document.createElement("tr");r.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});frag.append(tr)});tb.append(frag)}}
$("search").addEventListener("input",render);$("refresh").addEventListener("click",load);
function downloadCsvFallback(filename){const rows=[headers,...data];const csv="\uFEFF"+rows.map(row=>row.map(v=>{const s=String(v??"");return '"'+s.replace(/"/g,'""')+'"'}).join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const url=window.URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename.replace(/\.xlsx$/i,".csv");document.body.appendChild(a);a.click();a.remove();setTimeout(()=>window.URL.revokeObjectURL(url),1000);status("Pustaka XLSX tidak tersedia. Data berhasil diunduh sebagai CSV yang dapat dibuka di Microsoft Excel.","success")}
$("download").addEventListener("click",()=>{try{if(!headers.length){status("Data belum siap. Silakan muat ulang terlebih dahulu.","error");return}const safe=s=>String(s||"Data").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"");const filename="Rekap-Bulanan-GPS-FM-"+safe($("activity").value)+"-"+safe($("month").selectedOptions[0]?.textContent||"Bulanan")+".xlsx";if(!window.XLSX||!XLSX.utils||!XLSX.writeFile){downloadCsvFallback(filename);return}const ws=XLSX.utils.aoa_to_sheet([headers,...data]);ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(data.length,1),c:headers.length-1}})};ws["!freeze"]={xSplit:0,ySplit:1,topLeftCell:"A2",activePane:"bottomLeft",state:"frozen"};const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Rekap GPS FM");XLSX.writeFile(wb,filename);status("File Excel berhasil disiapkan untuk diunduh.","success")}catch(e){status("Unduhan Excel gagal: "+(e?.message||"Kesalahan tidak diketahui")+". Mencoba format CSV yang dapat dibuka di Excel.","error");try{downloadCsvFallback("Rekap-Bulanan-GPS-FM.xlsx")}catch(err){status("Unduhan gagal. Coba muat ulang halaman dan periksa pengaturan unduhan browser.","error")}}});load();
</script></body></html>
