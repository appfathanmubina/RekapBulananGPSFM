<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#38216b"><meta name="description" content="Tampilan publik Rekap Bulanan dengan unduhan Excel.">
<title>Rekap Bulanan</title>
<style>
:root{--p:#38216b;--p2:#56389a;--gold:#e7bd62;--ink:#28243b;--muted:#77748b;--line:#e9e5f1;--bg:#f6f4fa;--green:#16834a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,"Segoe UI",sans-serif}
.hero{background:linear-gradient(120deg,#2b1857,#56389a);color:white;padding:30px 20px 72px}.hero-inner{max-width:1200px;margin:auto;display:flex;align-items:center;gap:16px}
.brand{width:56px;height:56px;border-radius:17px;background:#ffffff20;border:1px solid #ffffff35;display:grid;place-items:center;font-size:28px}
h1{font-size:clamp(25px,4vw,35px);margin:0 0 7px;letter-spacing:-.6px}.subtitle{margin:0;color:#e5ddf5;font-size:14px}
main{max-width:1200px;margin:-46px auto 36px;padding:0 16px}.panel{background:white;border:1px solid #eeeaf5;border-radius:20px;box-shadow:0 14px 40px #2c1a4b12;overflow:hidden}
.toolbar{padding:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.search{position:relative;flex:1;min-width:210px}
input{width:100%;padding:12px 14px;border:1px solid #ddd8e9;border-radius:11px;font:inherit;outline:none}input:focus{border-color:#8c75c5;box-shadow:0 0 0 3px #8c75c522}
button{border:0;border-radius:11px;padding:12px 16px;font:600 13px system-ui;cursor:pointer;transition:.15s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.55;cursor:wait}.secondary{background:#f0ebf8;color:var(--p)}.primary{background:var(--green);color:#fff}
.meta{display:flex;gap:10px;flex-wrap:wrap;padding:16px 20px 0}.stat{border:1px solid var(--line);border-radius:12px;padding:11px 14px;min-width:130px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}.value{font-size:18px;font-weight:800;margin-top:5px}
.sheet-details{margin:16px 20px 0;padding:15px 18px;display:flex;gap:14px;flex-wrap:wrap;background:#faf8ff;border:1px solid var(--line);border-radius:12px}.sheet-details>div{flex:1;min-width:180px;display:flex;flex-direction:column;gap:5px}.sheet-details span{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.5px}.sheet-details strong{font-size:16px;color:var(--p);overflow-wrap:anywhere}.status{margin:15px 20px 0;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.5;background:#f4f1fb;color:#5d4b87}.status.error{background:#fff1f0;color:#b42318}.status.success{background:#eaf7ef;color:#166534}
.table-wrap{overflow:auto;margin:16px 20px 20px;border:1px solid var(--line);border-radius:12px;max-height:66vh}table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}thead th{position:sticky;top:0;background:#eee8f8;color:var(--p);font-weight:800;text-align:left;white-space:nowrap;z-index:1}th,td{padding:13px 14px;border-bottom:1px solid #efedf4;border-right:1px solid #f1eff6;max-width:420px}th:last-child,td:last-child{border-right:0}tbody tr:nth-child(even){background:#fbfaff}tbody tr:hover{background:#f2edfb}td{white-space:pre-wrap;overflow-wrap:anywhere}.empty{text-align:center;padding:35px;color:var(--muted)}footer{text-align:center;color:#8a8599;font-size:11px;padding:0 20px 20px}
@media(max-width:620px){.hero{padding:24px 16px 66px}.brand{width:48px;height:48px}.toolbar{padding:14px}.search{min-width:100%}.toolbar button{flex:1}.meta{padding:13px 14px 0}.stat{flex:1;min-width:calc(50% - 6px)}.table-wrap{margin:14px 12px;max-height:65vh}th,td{padding:11px 12px;max-width:260px}.status{margin:13px 14px 0}.sheet-details{margin:13px 14px 0;padding:13px}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner"><div class="brand" aria-hidden="true">▦</div><div><h1>Rekap Bulanan</h1><p class="subtitle">Ringkasan data bulanan · Tampilan publik</p></div></div></header>
<main><section class="panel" aria-label="Data Rekap Bulanan">
<div class="toolbar"><label class="search"><input id="search" type="search" placeholder="Cari di semua kolom…" aria-label="Cari data"></label><button id="refresh" class="secondary">↻ Muat ulang</button><button id="download" class="primary" disabled>⇩ Unduh Excel (.xlsx)</button></div>
<div class="meta"><div class="stat"><div class="label">Total baris data</div><div id="rows" class="value">—</div></div><div class="stat"><div class="label">Jumlah kolom</div><div id="cols" class="value">—</div></div><div class="stat"><div class="label">Terakhir dimuat</div><div id="updated" class="value" style="font-size:13px">—</div></div></div>
<div class="sheet-details"><div><span>Nama Kegiatan</span><strong id="activity">Memuat…</strong></div><div><span>Bulan</span><strong id="month">Memuat…</strong></div></div><div id="status" class="status" role="status" aria-live="polite">Menghubungkan ke spreadsheet…</div><div class="table-wrap"><table id="table"><thead></thead><tbody><tr><td class="empty">Memuat data…</td></tr></tbody></table></div>
<footer>Sumber data: Google Spreadsheet · <strong>Rekap Bulanan</strong></footer></section></main>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const ID="1Z4d9NiKfyV4UV0U9uZdlZNIZcMxXmNvzK5zbgnPFBSw",GID="1547468434";
const URL=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&gid=${GID}&range=B8%3AH76`; const cellURL=cell=>`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?tqx=out:csv&gid=${GID}&range=${cell}`;
const $=id=>document.getElementById(id);let headers=[],data=[];
function status(msg,type=""){$("status").textContent=msg;$("status").className="status"+(type?" "+type:"")}
function csvParse(s){let out=[],r=[],c="",q=false;for(let i=0;i<s.length;i++){let x=s[i];if(q){if(x==='"'&&s[i+1]==='"'){c+='"';i++}else if(x==='"')q=false;else c+=x}else if(x==='"')q=true;else if(x===","){r.push(c);c=""}else if(x==="\n"){r.push(c.replace(/\r$/,""));out.push(r);r=[];c=""}else c+=x}if(c.length||r.length){r.push(c.replace(/\r$/,""));out.push(r)}while(out.length&&out[out.length-1].every(v=>!String(v).trim()))out.pop();return out}
async function readCell(cell){const r=await fetch(cellURL(cell),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const p=csvParse(await r.text());return p?.[0]?.[0]??""}
async function load(){ $("refresh").disabled=true;$("download").disabled=true;status("Mengambil data dari rentang B8:H76…");try{const [activity,month]=await Promise.all([readCell("D4"),readCell("D6")]);$("activity").textContent=activity||"—";$("month").textContent=month||"—";let res=await fetch(URL,{cache:"no-store"});if(!res.ok)throw Error("HTTP "+res.status);let txt=await res.text();if(/^\s*<(!doctype|html)/i.test(txt))throw Error("Google mengirim halaman HTML, bukan CSV. Pastikan sheet dapat diakses publik.");let parsed=csvParse(txt);if(!parsed.length||!parsed[0].length)throw Error("Sheet kosong atau belum dipublikasikan.");headers=parsed[0].slice(0,7).map((v,i)=>String(v).trim()||"Kolom "+(i+1));data=parsed.slice(1,69).filter(r=>r.slice(0,7).some(v=>String(v??"").trim())).map(r=>headers.map((_,i)=>r[i]??""));render();$("rows").textContent=data.length.toLocaleString("id-ID");$("cols").textContent=headers.length.toLocaleString("id-ID");$("updated").textContent=new Date().toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});$("download").disabled=false;status("Data berhasil dimuat dari sheet Rekap Bulanan.","success")}catch(e){headers=[];data=[];render();$("rows").textContent="—";$("cols").textContent="—";$("updated").textContent="—";status("Data belum dapat dimuat. Pastikan sheet dipublikasikan ke web atau dapat diakses publik. Detail: "+e.message,"error")}finally{$("refresh").disabled=false}}
function render(){let term=$("search").value.trim().toLocaleLowerCase("id"),filtered=data.filter(r=>!term||r.some(v=>String(v).toLocaleLowerCase("id").includes(term))),th=$("table").querySelector("thead"),tb=$("table").querySelector("tbody");th.replaceChildren();tb.replaceChildren();if(!headers.length){let tr=document.createElement("tr"),td=document.createElement("td");td.className="empty";td.textContent="Belum ada data untuk ditampilkan.";tr.append(td);tb.append(tr);return}let hr=document.createElement("tr");headers.forEach(h=>{let x=document.createElement("th");x.textContent=h;hr.append(x)});th.append(hr);if(!filtered.length){let tr=document.createElement("tr"),td=document.createElement("td");td.colSpan=headers.length;td.className="empty";td.textContent=term?"Tidak ada data yang cocok.":"Sheet belum berisi baris data.";tr.append(td);tb.append(tr)}else{let frag=document.createDocumentFragment();filtered.forEach(r=>{let tr=document.createElement("tr");r.forEach(v=>{let td=document.createElement("td");td.textContent=v;tr.append(td)});frag.append(tr)});tb.append(frag)}if(term)status("Menampilkan "+filtered.length.toLocaleString("id-ID")+" dari "+data.length.toLocaleString("id-ID")+" baris yang cocok.","success");else if(data.length)status("Data berhasil dimuat dari sheet Rekap Bulanan.","success")}
$("search").addEventListener("input",render);$("refresh").addEventListener("click",load);$("download").addEventListener("click",()=>{if(!data.length||!window.XLSX){status("Data atau pustaka Excel belum tersedia. Periksa koneksi dan muat ulang.","error");return}let ws=XLSX.utils.aoa_to_sheet([headers,...data]);ws["!autofilter"]={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:data.length,c:headers.length-1}})};ws["!freeze"]={xSplit:0,ySplit:1,topLeftCell:"A2",activePane:"bottomLeft",state:"frozen"};let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Rekap Bulanan");XLSX.writeFile(wb,"Rekap-Bulanan-B8-H76.xlsx")});load();
</script></body></html>
